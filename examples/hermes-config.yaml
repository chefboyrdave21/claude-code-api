# Hermes config template: the parts of ~/.hermes/config.yaml that wire Hermes to
# claude-code-api. NOT a complete config. Merge these keys into your own
# ~/.hermes/config.yaml (the live file is not under version control, so this
# file is its source of truth for these keys).
#
# Path: Hermes -> skgateway (:18780, its `anthropic` backend holds CCAPI_TOKEN)
#       -> claude-code-api (:18782) -> `claude --print`.
# Never point Hermes at api.anthropic.com with the subscription token: that is
# billed as third-party usage and fails.
#
# Verified 2026-10-05 against Hermes + claude-code-api main (#7, #8):
#   hermes chat -q "Run 'date' with your terminal tool"     -> real tool call
#   hermes chat --image red.png -q "what color?"             -> ccapi logs "| images"

model:
  default: claude-opus-5
  provider: custom:skgateway
  context_length: 500000

agent:
  # Send images to the main model as image parts. In `auto`, an explicit
  # auxiliary.vision backend (below) always wins, so the main model would only
  # ever get sk-vision's text description of an image.
  image_input_mode: native

auxiliary:
  # Still used: by the vision_analyze tool, and for any main model NOT listed
  # under `providers` below (it keeps the describe-then-text fallback).
  vision:
    provider: skgateway
    model: sk-vision
    base_url: http://127.0.0.1:18780/v1
    api_key: ''
    timeout: 120
    download_timeout: 30

custom_providers:
  - name: skgateway
    base_url: http://127.0.0.1:18780/v1
    api_key: ''            # skgateway authenticates upstream; nothing to put here
    api_mode: chat_completions
    discover_models: true
    models:   # keep in sync with providers below
      - claude-opus-5
      - claude-opus-5-5
      - claude-sonnet-5-5
      - claude-sonnet-5
      - claude-fable-5-1
      - claude-fable-5
      - claude-opus-4-8
      - claude-opus-4-7
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
      - qwen3.8-27b-huihui-abliterated-q4_k_m
      - ornith-1.5-9b
      - moonshotai/kimi-k3
      - z-ai/glm-5.3
      - nvidia/nemotron-3-super-120b-a12b
      - sk-auto
      - sk-default
      - sk-heavy
      - sk-creative
      - sk-vision
      - sk-s-public
      - sk-s-internal
      - sk-s-secret
      - sk-m-public
      - sk-m-internal
      - sk-m-secret
      - sk-l-internal
      - sk-l-secret
      - sk-xl-public
      - sk-xl-internal

# THE skgateway model list for the /model picker, plus per-model capabilities.
# Hermes treats `providers.custom:skgateway` as the provider row: its model keys
# REPLACE custom_providers[skgateway].models in the picker. So every pickable
# model must be listed here, not only the vision ones (2026-10-05: listing just
# the 6 vision models shrank the picker to 6).
#
# Curated to models that answered a live probe on 2026-10-05. skgateway's own
# /v1/models is not used directly: it still advertises end-of-life names
# (qwen3.8-27b, qwen3.8-27b-ud-q5_k_xl, qwen38-abliterated; chiap08 now serves
# only the huihui abliterated qwen3.8, under three aliases) and two buckets no
# model satisfies (sk-l-public, sk-xl-secret).
#
# supports_vision: true is required TOGETHER with agent.image_input_mode: native,
# otherwise run_agent strips image parts and falls back to sk-vision. Unflagged
# models keep that describe-then-text fallback.
#
# Hermes rewrites config.yaml on /model --global saves and drops comments, so
# the explanations live here, not in the live file. Edit the live file with a
# comment-preserving tool (ruamel) or by hand.
providers:
  custom:skgateway:
    models:
      claude-opus-5: {supports_vision: true}
      claude-opus-5-5: {supports_vision: true}
      claude-sonnet-5-5: {supports_vision: true}
      claude-sonnet-5: {supports_vision: true}
      claude-fable-5-1: {supports_vision: true}
      claude-fable-5: {supports_vision: true}
      claude-opus-4-8: {}
      claude-opus-4-7: {}
      claude-sonnet-4-6: {}
      claude-haiku-4-5-20251001: {}
      qwen3.8-27b-huihui-abliterated-q4_k_m: {supports_vision: true}
      ornith-1.5-9b: {}
      moonshotai/kimi-k3: {}
      z-ai/glm-5.3: {}
      nvidia/nemotron-3-super-120b-a12b: {}
      sk-auto: {}
      sk-default: {}
      sk-heavy: {}
      sk-creative: {}
      sk-vision: {}
      sk-s-public: {}
      sk-s-internal: {}
      sk-s-secret: {}
      sk-m-public: {}
      sk-m-internal: {}
      sk-m-secret: {}
      sk-l-internal: {}
      sk-l-secret: {}
      sk-xl-public: {}
      sk-xl-internal: {}

# Per-chat model switch (added 2026-10-05). Claude models will not produce
# explicit content, so intimate sessions move to the local abliterated model and
# back. Session-scoped: the global default above is untouched, and /new, /reset
# or a session auto-reset also return the chat to it. The exec worship/datenight
# quick commands never touch the model and need neither.
quick_commands:
  bloom:
    type: alias
    target: /model qwen3.8-27b-huihui-abliterated-q4_k_m --provider custom:skgateway --session
    description: 🌸 Bloom mode for this chat (abliterated local model, same Lumina)
  work:
    type: alias
    target: /model claude-opus-5 --provider custom:skgateway --session
    description: 🛠️ Back to Opus for this chat (tools, work, images)

# NOT config.yaml: ~/.hermes/context_length_cache.yaml. A /model switch drops
# model.context_length and looks the window up again; per-model context_length
# under custom_providers needs `models` as a dict, which breaks the /model picker
# (it expects a list). So the windows live in Hermes' context cache instead:
#
#   context_lengths:
#     qwen3.8-27b-huihui-abliterated-q4_k_m@http://127.0.0.1:18780/v1: 131072
#     claude-opus-5@http://127.0.0.1:18780/v1: 500000
#
# Without the first entry a /bloom chat inherits 500k, never compresses in time,
# and fails at chiap08's 131072-token limit.
