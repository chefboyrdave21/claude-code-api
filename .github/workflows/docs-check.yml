name: docs-check

# Tiers 1 and 2 only, deliberately.
#
#   1 = the seven SK_REPO_DOC_STANDARD files exist
#   2 = a PR that changes code also changes CHANGELOG.md
#   3 = every check in SOP.md's docs-evidence block still exits 0
#
# SOP.md DOES carry a docs-evidence block, and it passes locally today. Tier 3 is
# still left off so this gate is green on day one; promoting to "1,2,3" is a
# deliberate follow-up once it has run clean, per DOCS_FRESHNESS_STANDARD.
#
# sk-standards is a public repo, so this cross-org reusable-workflow call resolves
# from chefboyrdave21 without any token or org configuration.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  docs:
    uses: smilinTux/sk-standards/.github/workflows/docs-check.yml@main
    with:
      tiers: "1,2"
